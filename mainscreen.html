<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Page</title>
    <style>
        /* General Reset */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, white, #c8c8c8);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 80%;
        }

        .input-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
            width: 100%;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.8);
            color: #333;
            outline: none;
            transition: all 0.3s ease-in-out;
        }

        input[type="text"]:focus {
            transform: scale(1.05);
            box-shadow: 0px 4px 10px rgba(255, 255, 255, 0.5);
        }

        .call-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff007f, #7b00ff);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .call-button:hover {
            transform: scale(1.1);
            box-shadow: 0px 8px 15px rgba(0, 0, 0, 0.4);
        }

        .call-button:active {
            transform: scale(1.05);
        }

        .call-button::after {
            content: "";
            background: url('./images/call.png') no-repeat center center;
            background-size: 24px;
            width: 24px;
            height: 24px;
        }

        iframe {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 15px;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0px 4px 10px rgba(255, 255, 255, 0.2);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            animation: fadeIn 0.3s forwards;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            width: 300px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            animation: popIn 0.3s forwards;
        }

        .modal-content p {
            margin: 0 0 20px 0;
            color: #333;
            font-size: 18px;
        }

        .cancel-button {
            border: none;
            background: #ff0033;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
        }

        .cancel-button img {
            width: 24px;
            height: 24px;
        }

        .cancel-button:hover {
            background: #ff3344;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
            }
            to {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="input-container">
            <input type="text" id="numberInput" placeholder="Enter number...">
            <button class="call-button" aria-label="Call"></button>
        </div>
        <iframe src="recentCalls.html"></iframe>
    </div>
    <script>
        const controller = window.top.controller;
        const app = window.parent.app;
        const input = document.querySelector("#numberInput");
        const callButton = document.querySelector(".call-button");
        const domainButtons = document.querySelectorAll(".domain-button");
        const keyboardToggle = document.querySelector("#keyboardToggle");
        const buttonContainer = document.querySelector(".button-container");

        controller.getAudioDevices();

        // Set initial input type
        input.inputMode = "tel";

        // Convert input to lowercase
        input.addEventListener('input', function(e) {
            this.value = this.value.toLowerCase();
        });

        callButton.addEventListener("click", function() {
            if (input.value != "") {
                makeCall({contact: input.value, id: input.value});
            }
        });

        window.addEventListener('message', (event) => {
            if (event.data.action == 'call') {
                makeCall(event.data.body);
            }
        });

        function makeCall(jsonData) {
            if (jsonData != null) {
                // Create modal overlay
                const modalOverlay = document.createElement('div');
                modalOverlay.classList.add('modal-overlay');

                // Create modal content
                const modalContent = document.createElement('div');
                modalContent.classList.add('modal-content');

                // Create message
                const message = document.createElement('p');
                message.textContent = `Attempting to call ${jsonData.contact}`;

                // Create cancel button
                const cancelButton = document.createElement('button');
                cancelButton.classList.add('cancel-button');
                cancelButton.setAttribute('aria-label', 'Cancel'); // For accessibility

                // Create an img element
                const cancelImage = document.createElement('img');
                cancelImage.src = './images/call_end.png'; // Path to your local PNG image
                cancelImage.alt = 'Cancel'; // Alternative text for accessibility
                cancelImage.style.width = '24px'; // Adjust the size as needed
                cancelImage.style.height = '24px';

                // Append the image to the button
                cancelButton.appendChild(cancelImage);

                // Append message and button to modal content
                modalContent.appendChild(message);
                modalContent.appendChild(cancelButton);

                // Append modal content to overlay
                modalOverlay.appendChild(modalContent);

                // Append overlay to body
                document.body.appendChild(modalOverlay);

                controller.call(jsonData.id)

                cancelButton.addEventListener('click', function() {
                    const endAttemptRequest = {
                        action: "call-ended",
                        body: {remoteId: jsonData.contact}
                    };
                    window.parent.postMessage(endAttemptRequest, '*');
                });
            }
        }
    </script>
</body>
</html>
